[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vg-telegram-manager"
version = "0.1.0"
description = "A versatile Telegram user-client manager to monitor channels, handle incoming messages, and forward events."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "espinosa012"}
]
keywords = ["telegram", "telethon", "client", "userbot", "monitoring", "webhook"]
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "telethon>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vgtelegrammanager", "vgtelegrammanager.*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["vgtelegrammanager"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
